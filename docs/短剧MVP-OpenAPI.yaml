    AdminRejectDramaRequest:
      type: object
      description: 驳回理由（可选）。空 body 也允许，相当于不带原因驳回。
      properties:
        reason:
          type: string
          maxLength: 255
          description: 驳回原因；将存在 `dramas.audit_reason` 列里返还给创作者展示
    AdminDrama:
      allOf:
      - $ref: '#/components/schemas/DramaItem'
      - type: object
        properties:
          category_id:
            type: integer
            description: 首要主题分类 ID（type=theme 的 Category.id）
          category_name:
            type: string
            description: 首要主题分类名（冗余字段，方便列表展示）
          creator_id:
            type: integer
            description: 所属创作者 ID；可为 null（平台自制剧）
          creator_name:
            type: string
            description: 创作者姓名（冗余字段，方便列表展示）
          status:
            type: string
            description: 发布阶段；待审核用 `reviewing`，审核结论看 `audit_status`
            enum:
            - draft
            - reviewing
            - awaiting_publish
            - published
            - offline
          audit_status:
            type: string
            description: "审核结论：\n  - `pending` / `approved` / `rejected`\n\n典型组合：\n\
              \  - `draft` × `approved`             ：纯草稿，未提交\n  - `reviewing` × `pending`\
              \          ：已提交，待审核\n  - `draft` × `rejected`             ：驳回后回到草稿\n\
              \  - `awaiting_publish` × `approved`  ：审核通过，待上架\n  - `published` × `approved`\
              \         ：已上架\n\n转换规则：\n  - submit          ：status → reviewing；audit_status\
              \ → pending\n  - admin approve   ：audit_status → approved；reviewing/draft/offline\
              \ → awaiting_publish\n  - admin reject    ：audit_status → rejected；reviewing/awaiting_publish\
              \ → draft；published → offline\n  - creator publish ：audit_status 必须\
              \ approved；awaiting_publish/offline → published\n"
            enum:
            - pending
            - approved
            - rejected
          audit_reason:
            type: string
            description: 驳回原因；非 rejected 时为空字符串（分批审核下为各维度原因的合并）
          content_audit_status:
            type: string
            enum:
            - pending
            - approved
            - rejected
            description: 分批审核·资料内容维度状态（新建/提交即初始化为 pending，不再返回空串；历史空串仍按 pending 处理）
          content_audit_reason:
            type: string
            description: 资料内容维度驳回原因
          video_audit_status:
