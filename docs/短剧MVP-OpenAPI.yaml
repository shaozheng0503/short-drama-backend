              type: integer
              description: 剧集 ID
            drama_id:
              type: integer
              description: 所属短剧 ID
            episode_no:
              type: integer
              description: 第几集
            title:
              type: string
              description: 本集标题
          description: 剧集基本信息
        play_url:
          type: string
          description: 真实播放地址（VOD CDN 直链）；含临时签名，仅当前用户能用
        expire_seconds:
