          description: 是否免费集（= episode_no <= 全局免费集数；2026-06 起按全局配置实时判定，非该剧快照）
        is_locked:
          type: boolean
          description: 当前用户是否需要解锁。免费集恒为 false；付费集已解锁也为 false；未登录用户付费集恒为 true
        like_count:
          type: integer
          description: 本集点赞数
        liked:
          type: boolean
          description: 当前登录用户是否赞过本集（匿名为 false）
        comment_count:
          type: integer
          description: 本集评论数（含楼中楼回复）
    PlayResponse:
      type: object
