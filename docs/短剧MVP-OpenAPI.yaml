  /v1/publisher/deposit/recharge:
    post:
      tags:
      - Publisher-Deposit
      summary: 发起押金充值
      description: '发起保证金充值。**单笔无最低限额，金额 > 0 即可（2026-07-17 取消了原 100 元下限）。**


        **测试环境（dev 模式）**：自动完成充值，直接返回 `{"status":"paid","message":"充值成功（dev 模式）"}`，秒到账。


        **生产环境**：创建 pending 充值单，调支付宝 prepay，返回 `recharge_no`/`amount_cents`/`payment_method`/`status:"pending"`/`expired_at`/`pay_params`。

        `pay_params` 内容取决于 `pay_scene`：

        - `pay_scene=wap`（默认）：返回 `pay_url`，前端 `window.location.href` 跳转即可拉起支付宝 H5
        手机网站支付。**网页端用这个。**

        - `pay_scene=app`：返回 `order_string`，App 端用支付宝 SDK 唤起。


        支付成功后支付宝异步回调 `POST /v1/webhooks/alipay/pay`，后端自动到账（加余额 + 写流水），前端可轮询 `GET /v1/publisher/deposit/account`
        确认余额变化。


        **双 AppID 说明（2026-07-20）**：后端已配置双支付宝应用，wap 和 app 使用不同 AppID（密钥相同），前端无需关心，按
        `pay_scene` 传参即可。


        **dev 模式模拟到账**（仅测试环境）：`POST /v1/dev/recharges/:recharge_no/pay` 一键模拟到账。


        **前端注意**：`status="pending"` 时不要显示"充值成功"，要跳转 `pay_url` 让用户支付；`status="paid"`
        才是到账（dev 模式直接 paid）。

        '
      operationId: publisherRecharge
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount_cents
              properties:
                amount_cents:
                  type: integer
                  description: 充值金额（分，> 0 即可，无最低限额）
                payment_method:
                  type: string
                  enum:
                  - alipay
                  - wechat
                  default: alipay
                  description: 支付方式
                pay_scene:
                  type: string
                  enum:
                  - wap
                  - app
                  default: wap
                  description: 支付场景：wap=手机网站支付(返回 pay_url，网页端用)；app=App支付(返回 order_string，App端用)
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
