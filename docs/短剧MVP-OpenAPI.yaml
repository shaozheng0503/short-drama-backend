          nullable: true
          description: 最近一次提交认证审核的时间；unverified 时为 null，pending 及以上必有值
        total_income_cents:
          type: integer
          description: 累计收入（**单位：分**；100 表示 1.00 元）。包含已提现和未提现部分
        balance_cents:
          type: integer
          description: 可提现余额（**单位：分**）。= 累计收入 - 已提现 - 冻结中
        frozen_cents:
          type: integer
          description: 冻结金额（**单位：分**）。已申请但未到账的提现金额暂占在此
        bank_name:
