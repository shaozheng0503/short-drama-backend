components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: 幂等键，Redis 缓存 10 分钟
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
          description: 业务状态码。0=成功；40001=参数错误；40101=未登录；40301=禁止；40401=不存在；40901=冲突；50001=服务器内部；60001=第三方依赖错误
        message:
          type: string
          example: ok
          description: 业务消息；成功固定为 "ok"
        data:
          nullable: true
          description: 业务数据；失败时为 null
    SimpleOkResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              ok:
                type: boolean
                example: true
                description: 操作是否成功；幂等接口固定 true
            description: 业务数据；失败时为 null
    SmsSendRequest:
      type: object
      required:
      - phone
      - scene
      properties:
        phone:
          type: string
          example: '13800138000'
          description: 接收验证码的手机号
        scene:
          type: string
          enum:
          - login
          - creator_login
          example: login
          description: '业务场景。**本接口仅支持登录发码**。

            - `login`：APP 用户登录

            - `creator_login`：创作者登录

            - 换绑银行卡 → 用 `POST /creator/bank-card/send-sms`，**不要**传 `bank_card_change`
            到本接口

            '
    PhoneLoginRequest:
      type: object
      required:
      - phone
      - code
      properties:
        phone:
          type: string
          example: '13800138000'
          description: 手机号
        code:
          type: string
          example: '1234'
          description: 短信验证码（默认 4-6 位，5 分钟内有效）
    AdminLoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          example: admin
          description: 用户名
        password:
          type: string
          example: '123456'
          description: 明文密码（HTTPS 下走）；后端用 bcrypt 校验
    ImageSignRequest:
      type: object
      description: 图片上传签名请求。全部字段可选；scene 决定 COS 子目录，ext 决定后缀，filename 仅作日志参考。
      properties:
        scene:
          type: string
          example: cover
          description: 业务场景，决定 COS key 前缀。常用：avatar / cover / banner / generic。
        ext:
          type: string
          example: jpg
          enum:
          - jpg
          - jpeg
          - png
          - webp
          - gif
          description: 文件后缀（不带点）。白名单外的返 40001。默认 jpg。
        filename:
          type: string
          example: cover.jpg
          description: 原文件名，仅作日志参考，不参与签名。
    ImageSignResponse:
      type: object
      description: 图片上传签名返回。前端用 upload_url 做 PUT，必须把 headers 里要求的 header 原样带上；上传成功后
        public_url 直接外链。
      properties:
        method:
          type: string
          enum:
          - PUT
          description: 前端用 PUT
        upload_url:
          type: string
          description: 带 COS 签名的 PUT URL，900s 有效
        public_url:
          type: string
          description: 上传完成后对外的访问 URL（公有读，浏览器可直接访问）
        key:
          type: string
          description: COS 对象 key（路径），形如 images/2026/05/22/cover/abc.jpg
        expires_at:
          type: string
          format: date-time
          description: 签名过期时间
        headers:
          type: object
          additionalProperties:
            type: string
          description: 前端 PUT 时必须把这些 header 原样带上，否则 COS 验签 403。当前固定包含 x-cos-acl=public-read。
    User:
      type: object
      properties:
        id:
          type: integer
          description: 用户 ID
        phone:
          type: string
          example: 138****8000
          description: 手机号（中国大陆 11 位）
        nickname:
          type: string
          description: 昵称；新用户默认 "用户{phone后4位}"
        avatar:
          type: string
          description: 头像 URL（公网可访问；用 /v1/common/uploads/image-sign 上传到 COS 后回传）
        status:
          type: string
          example: active
          description: 用户状态
          enum:
          - active
          - banned
    UpdateUserRequest:
      type: object
      properties:
        nickname:
          type: string
          description: 昵称
        avatar:
          type: string
          description: 头像 URL（COS 公网链接）
    AppLoginResponse:
      type: object
      properties:
        token:
          type: string
          description: 'JWT 访问令牌；后续请求放 `Authorization: Bearer <token>` 头'
        user:
          $ref: '#/components/schemas/User'
          description: 当前登录用户基本信息
        is_new_user:
          type: boolean
          description: 是否本次为新用户首次登录（首次会自动建账号）
    Category:
      type: object
      description: '短剧分类项。红果短剧 4 维筛选分类。一部剧通常 1 个 theme + 多个 setting + 1~2 个 background
        + 1 个 audience：

        - `theme` 主题（29 项）：现言 / 古言 / 悬疑 / 喜剧 / 青春 / 战神 / 宫斗 / 仙侠 …

        - `setting` 设定（42 项）：豪门 / 重生 / 穿越 / 大女主 / 神豪 / 甜宠 / 追妻火葬场 …

        - `background` 背景（11 项）：现代 / 都市 / 古代 / 校园 / 民国 / 宫廷 / 荒岛 …

        - `audience` 受众（2 项）：男频 / 女频'
      properties:
        id:
          type: integer
          description: 分类 ID
        type:
          type: string
          enum: *id001
          description: 维度。新建时默认 `theme`；不同维度下 name 可重复。
        name:
          type: string
          description: 分类名，如「现言」「重生」「都市」「女频」
        sort_order:
          type: integer
          description: 排序值；小的靠前
        status:
          type: string
          enum:
          - active
          - disabled
          description: 启用状态
    DramaItem:
      type: object
      properties:
        id:
          type: integer
          description: 短剧 ID
        title:
          type: string
          description: 短剧标题
        description:
          type: string
          description: 短剧简介
        cover_url:
          type: string
          description: 封面图 URL（COS 公网链接）
        total_episodes:
          type: integer
          description: 总集数
        free_episodes:
          type: integer
          description: 免费集数（前 N 集免费观看，后续付费解锁）。2026-06 起取**全局配置**实时值，非该剧建剧时的快照
        price_cents:
          type: integer
          description: '**单集解锁价格（分）**；100 = 1.00 元'
        play_count:
          type: integer
          description: 累计播放次数
        like_count:
          type: integer
          description: 点赞数
        favorite_count:
          type: integer
          description: 收藏数
        share_count:
          type: integer
          description: 分享次数
        tags:
          type: array
          items:
            type: string
          description: 分类标签（题材优先，如 ["都市日常","重生","古代"]）；`GET /app/theater` 与 `GET /app/dramas`
            均返回，前端可截前 N 个展示「类型」
    TheaterRecommendPage:
      type: object
      description: 剧场页推荐流分页（含 recommend_seed）
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/DramaItem'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean
        recommend_seed:
          type: string
          description: 推荐排序种子；翻页时原样传回 query seed
          example: a1b2c3d4e5f67890
    DramaPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/DramaItem'
          description: 当前页数据
        page:
          type: integer
          description: 当前页码，从 1 开始
        page_size:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总记录数
        has_more:
          type: boolean
          description: 是否还有下一页
    MyLikeItem:
      type: object
      properties:
        episode_id:
          type: integer
          description: 剧集 ID
        episode_no:
          type: integer
          description: 第几集（如 4 表示第4集）
        drama_id:
          type: integer
          description: 所属短剧 ID
        title:
          type: string
          description: 短剧标题
        cover_url:
          type: string
          description: 封面（剧集无封面，用所属剧主封面）
        like_count:
          type: integer
          description: 该集点赞数
        liked_at:
          type: string
          format: date-time
          description: 点赞时间
    MyLikePage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/MyLikeItem'
          description: 当前页数据
        page:
          type: integer
          description: 当前页码，从 1 开始
        page_size:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总记录数
        has_more:
          type: boolean
          description: 是否还有下一页
    HomeResponse:
      type: object
