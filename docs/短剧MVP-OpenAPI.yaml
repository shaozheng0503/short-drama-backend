    PersonalVerificationRequest:
      type: object
      description: '个人实名认证请求体（首次提交 / 驳回后重提）。**换绑银行卡请用 `ChangeBankCardRequest` + `/creator/bank-card/change`**（§7.1）。


        **重新提交规则（2026-06）**：敏感字段 `id_card_no` / `bank_card_no` **可不传**——留空则沿用库里已存值（首次提交必填）。

        前端重提表单可用脱敏值占位，用户不改就不回传。

        '
      required:
      - name
      - bank_name
      properties:
        name:
          type: string
          example: 张三
          description: 真实姓名，与身份证一致（必填）
        id_card_no:
          type: string
          example: '110101199001011234'
          description: 18 位身份证号，末位可为 X。重新提交可不传（留空沿用库里值），首次提交必填
        bank_name:
          type: string
          example: 招商银行
          description: 开户银行名称（必填）
        bank_branch:
          type: string
          example: 招商银行深圳科技园支行
          description: 开户支行（选填）
        bank_card_no:
          type: string
          example: '6214831234567890'
          description: 16~19 位银行卡号。重新提交可不传（留空沿用库里值），首次提交必填
        sms_code:
          type: string
          description: '**已废弃于本接口（2026-06）**：认证提交不再需要短信验证码、不会因换卡被拦。

            短信验证仅用于「已认证后换绑打款卡」`/creator/bank-card/change`。本字段保留仅为兼容旧前端，传了也会被忽略。

            '
          deprecated: true
    EnterpriseVerificationRequest:
      type: object
      description: '企业认证请求体（首次提交 / 驳回后重提）。**换绑银行卡请用 `ChangeBankCardRequest` + `/creator/bank-card/change`**（§7.1）。


        **重新提交规则（2026-06）**：敏感字段 `org_legal_id_card` / `bank_card_no` **可不传**——留空则沿用库里已存值（首次提交必填）。

        前端重提表单可用脱敏值占位，用户不改就不回传。

        '
      required:
      - org_name
      - org_credit_code
      - org_legal_person
      - business_license_url
      - bank_name
      properties:
        org_name:
          type: string
        org_credit_code:
          type: string
        org_legal_person:
          type: string
          description: 法定代表人姓名（企业四要素核验项，必填）
        org_legal_id_card:
          type: string
          description: '法人注册登记证件号码（身份证号，18 位，企业四要素核验项）。

            重新提交可不传（留空沿用库里值），首次提交必填。

            '
        business_license_url:
          type: string
        bank_license_url:
          type: string
          description: 银行开户许可证图片 URL（机构认证；审核人员核对银行信息用，选填）
        bank_name:
          type: string
        bank_branch:
          type: string
          description: 开户支行（选填）
        bank_card_no:
          type: string
          example: '12345678901234567890'
          description: '企业对公银行账号（不是个人银行卡号），9~30 位数字；后台人工核对（无第三方核验）。

            重新提交可不传（留空沿用库里值），首次提交必填。

            '
        sms_code:
          type: string
          description: '**已废弃于本接口（2026-06）**：认证提交不再需要短信验证码、不会因换对公账号被拦。

            短信验证仅用于「已认证后换绑打款账户」`/creator/bank-card/change`。本字段保留仅为兼容，传了会被忽略。

            '
          deprecated: true
    ChangeBankCardRequest:
