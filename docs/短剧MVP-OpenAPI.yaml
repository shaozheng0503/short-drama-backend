  /creator/withdrawals:
    post:
      tags:
      - Creator
      summary: '[✅ 已完成 0.14.0] 提现申请（合并发票上传，全额提现）'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWithdrawalRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Withdrawal'
      description: '**实现状态**：✅ 已完成


        **0.14.0 改（邱嘉诚 7/7 反馈）：发票和提现合并**

        - 每次提现上传一张发票，不再单独调 `/invoices` 接口

        - 发票在提现事务内自动创建，金额 = 结算单实收净额（全额提现）

        - 一张结算单只允许一笔 pending/approved 的提现（暂不支持多次提现）


        **必传字段**：

        - `settlement_id`：结算单 ID

        - `invoice_file_url`：发票文件 URL（先调 `/v1/common/uploads/image-sign` 拿 COS 签名上传）

        - `invoice_type`：发票类型（`evat_special` / `evat_general` / `vat_special` / `vat_general`）


        **可选字段**：

        - `amount_cents`：不传则自动用 `settlement.net_cents`（全额）；传了必须等于结算单净额

        - `invoice_external_no`：发票号（纸质票号）

        - `invoice_file_hash` / `invoice_file_size`：文件哈希/大小


        **事务内执行**：

        1. 校验结算单属于本创作者、状态为 unsettled

        2. 校验该结算单无 pending/approved 的提现

        3. 自动创建发票（amount = settlement.NetCents）

        4. 2026-08-12 简化：上传发票不再改变结算单状态

        5. 扣 balance、加 frozen

        6. 创建提现单（关联 invoice_id）


        **常见错误**：

        - 资料不完整 → `40001`，`data.missing_fields` 供前端高亮

        - 结算单已结清/作废 → `40901`

        - 该结算单已有提现申请 → `40901`

        - amount_cents ≠ 结算单净额 → `40001`（只支持全额提现）


        **幂等**：`Idempotency-Key` header 强幂等（Redis 30 分钟 TTL）。

        '
      x-apifox-status: released
