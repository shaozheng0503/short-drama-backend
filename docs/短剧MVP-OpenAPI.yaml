                type: string
                description: 视频播放地址
              duration_seconds:
                type: integer
                description: 时长（秒）
              comment_count:
                type: integer
                description: 本集评论数（含楼中楼回复）
    DramaDetail:
      allOf:
      - $ref: '#/components/schemas/DramaItem'
      - type: object
        properties:
          category:
            $ref: '#/components/schemas/Category'
            description: 分类（首要主题）；详见 schema 顶部 Category 说明
          is_liked:
            type: boolean
            description: 当前登录用户是否已点赞；匿名调用恒为 false
          is_favorited:
            type: boolean
            description: 当前登录用户是否已收藏；匿名调用恒为 false
          last_watch:
            type: object
            nullable: true
            properties:
              episode_id:
                type: integer
                description: 最近观看的剧集 ID
              episode_no:
                type: integer
                description: 剧集集数
              progress_seconds:
                type: integer
                description: 播放进度（秒）
            description: 当前用户在这部剧上的最近观看进度；从未观看返 null
      description: '**注**：`category_id` / `category` 字段当前指 drama 的**首要主题（theme）**。其它维度（setting/background/audience）通过
        `drama_tags` 多对多关联，目前 MVP 阶段后端 API 还未把 tags 暴露到响应（DB 已存）—— 多维筛选 API 待后续迭代。'
    EpisodeItem:
      type: object
      properties:
        id:
          type: integer
          description: 剧集 ID
        episode_no:
          type: integer
          description: 第几集，从 1 开始
        title:
