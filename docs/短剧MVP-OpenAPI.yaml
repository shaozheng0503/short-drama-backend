      properties:
        id:
          type: integer
          description: 用户 ID
        nickname:
          type: string
          description: 用户昵称
        avatar:
          type: string
          description: 用户头像 URL
    Comment:
      type: object
      properties:
        id:
          type: integer
          description: 评论 ID
        drama_id:
          type: integer
          description: 所属短剧 ID
        episode_id:
          type: integer
          nullable: true
          description: 空=剧评；有值=该集的集评
        parent_id:
          type: integer
          nullable: true
          description: 空=顶层评论；有值=楼中楼回复（指向顶层评论，回复的回复也拍平挂到同一顶层）
        user:
