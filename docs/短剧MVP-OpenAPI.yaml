openapi: 3.0.3
info:
  title: 短剧 APP MVP API
  version: 0.19.5
  description: "短剧 APP MVP 后端接口文档，用于导入 Apifox。\n\n## 近期变更（0.19.5，2026-08-28 — 分批审核修复）\n\
    - **NULL 审核维度修复**：存量剧 `content_audit_status` / `video_audit_status` 为 NULL 的行已全部回填（53 部），\
    \ 管理端审核弹窗不再显示 unknown / 按钮置灰\n- **驳回回退语义变更**：分批审核任一维度驳回即回退 status\
    \ （published→offline / 其余→draft），创作者立即可编辑并重新提审；无需再等另一维度审完\n- **draft 态 rejected 透出**：\
    \ 驳回后 status 回 draft 时，`audit_status` / 两维度状态及原因不再被 `not_submitted` 覆盖，创作者与中台均可看到驳回原因\n\
    \n## 近期变更（0.19.4，2026-08-28 — 收益导入类目列\
    \ + 视频号平台自发 + 应付45%口径）\n- **导入模板新增「类目/发行商」两列**（H=类目 收入/押金，I=发行商）：类目=押金时只读\
    \ C 列金额 + I 列发行商（名称或手机号），给发行商可用押金充值并写流水；不进任何收入表、不产生分成与未结清\n\
    - POST /v1/admin/finance/income/import — 响应新增 `deposit_rows` / `deposit_cents` 汇总，\
    \ `row_reports[].category` 字段\n- **视频号 = 平台自发渠道**：导入渠道=视频号时一律跳过发行商分成生成（发行商实得恒为\
    \ 0，E 列填了也不生效）\n- **E 列发行商分成比例按行生效**：填了（含 0%）按该值生成发行商分成，留空默认 55%\n- **渠道收益明细**：GET\
    \ /v1/admin/finance/channel-incomes — 每行新增 `platform_cents` / `distributor_name` / `distributor_income_cents`\
    \ / `distributor_share_ratio_bp`（按 剧+日期+渠道 关联，修视频号行错挂同日抖音分成），响应新增 `totals` 金额合计\n- **发行商应付金额统一\
    \ 45% 口径**：结算单生成与补录均为 `payable = 45%×总收益 - 押金抵扣`，抵扣上限收紧为平台分成（消除负数应付）\n\
    \n## 近期变更（0.16.3，2026-07-30 — 放弃认领\
    \ + 剧集打回）\n- **放弃认领功能**：发行商可申请放弃已认领的平台，管理员审核通过后退还押金差额\n  - POST /v1/publisher/claimed-dramas/{id}/abandon\
    \ — 创建放弃申请（支持上传原因截图）\n  - GET /v1/publisher/abandon-requests — 放弃申请列表\n  - GET\
    \ /v1/publisher/abandon-requests/{id} — 放弃申请详情\n  - GET /v1/admin/distributor-abandons\
    \ — 管理端列表\n  - GET /v1/admin/distributor-abandons/{id} — 管理端详情\n  - POST /v1/admin/distributor-abandons/{id}/approve\
    \ — 审核通过\n  - POST /v1/admin/distributor-abandons/{id}/reject — 审核驳回\n- **剧集打回功能**：管理员可将已上架剧集打回草稿，支持总体原因和分集原因\n\
    \  - POST /v1/admin/dramas/{id}/sendback — 打回已上架剧集\n- **驳回增强**：驳回接口新增 episode_reasons\
    \ 参数，支持每集批注\n  - POST /v1/admin/dramas/{id}/reject — 驳回（新增 episode_reasons）\n\
    - 放弃认领申请返回 drama_cover_url（剧集封面）\n- 放弃认领申请支持 reason_images（原因截图，最多 9 张）\n"
servers:
- url: https://api-dev.langzhi.top/v1
  description: 沙箱/联调环境（当前联调用这个，假钱、dev 短信）
- url: https://api.langzhi.top/v1
  description: 生产环境（真钱）
- url: https://api-dev.langzhi.top
  description: 沙箱·健康检查专用（/health、/ready 无 /v1 前缀）
- url: https://api.langzhi.top
  description: 生产·健康检查专用（/health、/ready 无 /v1 前缀）
- url: http://localhost:8080/v1
  description: 本地开发环境
tags:
- name: Common
  description: 通用接口
- name: AppAuth
  description: APP 用户登录与资料
- name: AppDrama
  description: APP 短剧浏览
- name: AppPlayback
  description: APP 播放与观看历史
- name: AppInteraction
  description: APP 互动
- name: AppPayment
  description: APP 支付与解锁
- name: Creator
  description: '创作者端。换绑银行卡见 **§7.1**：`POST /creator/bank-card/send-sms` + `POST /creator/bank-card/change`（与登录发码分离）。

    '
- name: AdminAuth
  description: 管理中台登录
- name: AdminDrama
  description: 管理中台短剧与剧集
- name: AdminCreator
  description: 管理中台创作者
- name: AdminFinance
  description: 管理中台财务
- name: AdminContract
  description: 管理中台合同
- name: AdminConfig
  description: 管理中台全局配置（价格等，写仅超管）
- name: UploadWebhook
  description: 上传与第三方回调
- name: Dev
  description: 🧪 仅 PAYMENT_DEV_MODE=true 挂载的联调接口；生产关闭后不存在
security:
- bearerAuth: []
paths:
  /v1/common/app/latest:
    get:
      tags:
      - Common
      summary: App 最新版本信息
      description: '返回 App 最新版本的下载地址和版本信息。**公开接口，无需登录。**


        官网下载按钮和 App 内更新检查都调这个接口。

        `download_url` 是 CDN 直链（cdn.langzhi.top），用户点击直接下载 APK，不经过后端服务器。


        发新版时只需更新服务器 .env 里的 APP_DOWNLOAD_URL / APP_VERSION / APP_VERSION_CODE / APP_UPDATE_LOG，重启服务即可。

        '
      operationId: getAppLatest
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /health:
    get:
      tags:
      - Common
      summary: '[✅ 已完成] 服务存活探针'
      security: []
      servers:
      - url: http://43.132.168.84:18080
        description: 测试环境（无 /v1）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/HealthResponse'
      description: '**实现状态**：✅ 已完成


        **用途**：运维 / K8s liveness 探针，**不在 /v1 下**。Apifox 请切换到「健康检查专用」server 或完整 URL
        `http://host:18080/health`。


        **响应示例**：

        ```json

        { "code": 0, "data": { "status": "ok", "uptime_seconds": 3600 } }

        ```

        '
      x-apifox-status: released
  /ready:
    get:
      tags:
      - Common
      summary: '[✅ 已完成] 服务就绪探针'
      security: []
      servers:
      - url: http://43.132.168.84:18080
        description: 测试环境（无 /v1）
      responses:
        '200':
          description: 就绪
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: 未就绪（DB/Redis 不可用）
      description: '**实现状态**：✅ 已完成


        **用途**：readiness 探针；会 ping PostgreSQL，配置了 Redis 时也会 ping Redis。


        **就绪响应**：`database=ok`, `redis=ok|skipped`

        '
      x-apifox-status: released
  /common/sms/send:
    post:
      tags:
      - Common
      summary: '[✅ 已完成] 发送短信验证码（APP / 创作者登录）'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
            examples:
              app_login:
                summary: APP 登录发码
                value:
                  phone: '13800138000'
                  scene: login
              creator_login:
                summary: 创作者登录发码
                value:
                  phone: '19703092478'
                  scene: creator_login
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        expire_seconds:
                          type: integer
                          example: 300
                          description: 验证码有效期（秒）。
                        dev_code:
                          type: string
                          example: '1234'
                          description: '**仅 dev 模式（`SMS_DEV_MODE=true`）回显**，用于 Apifox
                            / 联调直接拿到验证码，无需收真实短信。生产模式（`SMS_DEV_MODE=false`）该字段不会出现。'
      description: '**实现状态**：✅ 已完成（**当前为 dev_code 调试模式**）


        **Handler**：`internal/handler/common.go::sendSMS`


        > ### ⚠️ 本接口仅用于登录发码

        > - APP 登录：`scene=login`

        > - 创作者登录：`scene=creator_login`

        > - **换绑银行卡** → 用 **`POST /creator/bank-card/send-sms`**（§7.1），**不要**调本接口


        | scene | 用途 |

        |-------|------|

        | `login` | APP 用户登录 |

        | `creator_login` | 创作者登录（**不可**用于换绑） |


        **Provider**：当前 `SMS_DEV_MODE=true`，走 `DevProvider`，响应 `data.dev_code` 回显验证码便于联调。


        **响应结构**（dev 模式）：

        ```json

        { "code": 0, "message": "ok", "data": { "expire_seconds": 300, "dev_code":
        "1234" } }

        ```


        > ⚠️ 生产模式（`SMS_DEV_MODE=false`）响应**不含** `dev_code`，需用户收真实短信。


        **限流**：

        - 同手机号 60 秒内重发 → `40901`

        - 单 IP 限流 → `42901`

        - 前端「获取验证码」按钮应做 **60s 倒计时**


        **错误码**：

        - `40001` 手机号格式不合法 / scene 非法（含误传 `bank_card_change`）

        - `40901` 发送过于频繁

        - `42901` IP 限流

        - `60001` 短信网关失败（生产）

        '
      x-apifox-status: released
  /common/uploads/image-sign:
    post:
      tags:
      - Common
      summary: '[✅ 已完成] 获取图片上传签名'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageSignRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ImageSignResponse'
      description: "**实现状态**：✅ 已完成\n\n**Handler**：`internal/handler/uploads.go::commonImageUploadSign`\
        \  \n**实现**：腾讯云 COS V5 HMAC-SHA1 预签名，无 SDK 依赖（`internal/cos/cos.go`）。  \n\
        **ACL**：签名固定带 `x-cos-acl=public-read`，对象一上传就是公有读，**前端 PUT 时必须把响应里 `headers.x-cos-acl`\
        \ 原样作为 HTTP header 带上**，否则验签失败。  \n**已实测**：sign → PUT(http=200) → GET public(http=200)\
        \ 全链路通。  \n**桶**：`duanju-1318683367`（ap-guangzhou）\n\n**注意**：创作者端请优先用 `POST\
        \ /creator/uploads/image-sign`（需 creator JWT，路径带 creator_id 审计）；本接口为公共入口，APP\
        \ 头像等匿名/任意端可用。"
      x-apifox-status: released
  /common/aigc-tools:
    get:
      tags:
      - Common
      summary: '[✅ 已完成] 拉取可选 AIGC 创作工具列表'
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        tools:
                          type: array
                          items:
                            type: string
                          description: 可选 AIGC 创作工具名列表（如 LaguClaw/即梦/小云雀）。向后兼容，仅用名称取这个。
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              logo_url:
                                type: string
                                description: 工具 logo URL（可空；自研工具 logo 由超管配置后回填）
                              builtin:
                                type: boolean
                                description: 是否平台自研（LaguClaw=true）。前端可加「自研」角标、置顶展示。
                          description: 含 logo / 自研标记的工具列表，前端渲染图标用这个。
      description: '**实现状态**：✅ 已完成。无需鉴权（与 /common/uploads/image-sign 同组）。创作者建剧表单 `aigc_tools`
        多选标签下拉用。自研工具 LaguClaw 始终置顶返回（builtin=true）。'
      x-apifox-status: released
  /common/languages:
    get:
      tags:
      - Common
      summary: '[✅ 已完成] 语言列表（扁平）'
      security: []
      parameters:
      - name: all
        in: query
        schema:
          type: string
        description: '"1"=返回全部（含非 active）；默认仅返回 active'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '#/components/schemas/LanguageNode'
                          description: 语言/方言扁平列表（含粤语等），建剧与筛选统一用 language_id
                        total:
                          type: integer
                          description: 列表条数
      description: '**实现状态**：✅ 已完成。无需鉴权。


        返回扁平列表（不再嵌套 `dialects`）。短剧仅存一个 `language_id`，可指向任意语言项（如普通话、粤语、英语）。

        '
      x-apifox-status: released
  /app/auth/login:
    post:
      tags:
      - AppAuth
      summary: '[✅ 已完成] APP 手机号登录 / 自动注册'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneLoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AppLoginResponse'
      description: '**实现状态**：✅ 已完成'
      x-apifox-status: released
  /app/me:
    get:
      tags:
      - AppAuth
      summary: '[✅ 已完成] 获取当前 APP 用户'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
      description: '**实现状态**：✅ 已完成'
      x-apifox-status: released
    put:
      tags:
      - AppAuth
      summary: '[✅ 已完成] 更新当前 APP 用户'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
      description: '**实现状态**：✅ 已完成


        用于把刚上传到 COS 的头像 URL 写入 user.avatar 字段。'
      x-apifox-status: released
  /app/home:
    get:
      tags:
      - AppDrama
      summary: '[✅ 已完成] APP 首页'
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/HomeResponse'
      description: '**实现状态**：✅ 已完成


        首页按抖音 / 红果短剧式视频流返回，不再返回 categories / hot_dramas；前端直接使用 `recommend_dramas`
        渲染上下滑视频流。每个推荐短剧会带 `first_episode.play_url`，默认取该短剧最靠前的 ready 剧集（通常为第 1 集）。'
      x-apifox-status: released
  /app/theater:
    get:
      tags:
      - AppDrama
      summary: '[✅ 已完成] 剧场页推荐流（图文）'
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: seed
        in: query
        schema:
          type: string
        description: '推荐排序种子。不传则每次请求生成新 seed（下拉刷新换一批推荐）。

          翻页时传上次响应里的 `recommend_seed`，保证第 2、3 页顺序稳定。

          '
      - name: audience
        in: query
        schema:
          type: string
        description: 可选，按男女频收窄推荐（男频/女频/通用）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/TheaterRecommendPage'
      description: '**实现状态**：✅ 已完成


        **页面**：剧场页（图文卡片），**不是**筛选列表页。


        与 `GET /app/dramas` 的区别：

        - **剧场页**：推荐流，刷新可换一批（`recommend_seed` + 伪随机排序）

        - **筛选页**：`GET /app/dramas`，固定 `sort=new|hot` + 分类/语言筛选，条件不变结果不变


        **卡片**：`DramaItem` + `tags`（题材优先，前端截前 N 个作「类型」），**不含** `first_episode` 视频流字段。


        **搜索框热词**：仍用 `GET /app/search/hot`。


        **前端用法**：

        1. 首屏 / 下拉刷新：不传 `seed` → 拿新 `recommend_seed` + `list`

        2. 上拉加载：传 `page=2&seed=<上次的 recommend_seed>`

        '
      x-apifox-status: released
  /app/categories:
    get:
      tags:
      - AppDrama
      summary: '[✅ 已完成] 分类列表（公开）'
      security: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - theme
          - setting
          - background
          - audience
        description: 按维度筛；不传则返回全部（混在一起）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '#/components/schemas/Category'
      description: '**实现状态**：✅ 已完成


        与 `/admin/categories` 同源、公开无需登录；APP 首页 / 列表页渲染分类 tab、`?category_id=` 过滤下拉的数据源。

        '
      x-apifox-status: released
  /app/dramas:
    get:
      tags:
      - AppDrama
      summary: '[✅ 已完成] 短剧筛选列表（非剧场推荐）'
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: category_id
        in: query
        description: 主分类(主题)单选，按 dramas.category_id 筛
        schema:
          type: integer
      - name: category_ids
        in: query
        description: 多维分类多选(主题/设定/背景/受众)，逗号分隔；语义 AND——剧须同时命中全部所选分类(走 drama_tags)
        schema:
          type: string
        example: 3,12,20
      - name: audience
        in: query
