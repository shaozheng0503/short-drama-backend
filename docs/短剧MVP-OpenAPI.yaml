        **2026-07-15 新增：自动生成发行商收益记录**。导入时按渠道名自动映射到发行商平台（抖音→douyin / 快手→kuaishou /
        视频号、微信视频号→wechat_video / B站、哔哩哔哩→bilibili），如果该剧该平台有发行商认领，自动按分成比例写入 `distributor_income_daily`
        并累加发行商余额。每行 `row_reports` 新增 `distributor_id` / `distributor_name` / `distributor_income_cents`
        / `distributor_status` / `distributor_message` 字段。无需再单独调 `/admin/finance/distributor-income/import`。


        **2026-08-28 新增（合作结算异常修正）**：


        - **E 列发行商分成比例生效**：填了有效值（支持 55 / 55% / 0.55，含 0%）按该值生成发行商分成；留空按默认 55%。

        - **视频号 = 平台自发渠道**：渠道为视频号/微信视频号时，发行商一律不参与分成（`distributor_status=skipped`，发行商数值记 0），创作者收益照常。

        - **H 列「类目」支持押金导入**：类目=押金时只读 C 列金额 + I 列发行商（名称或手机号，需唯一匹配），给发行商「可用押金」充值并写押金流水（type=recharge）；不进 `channel_income_daily` / `creator_stats_daily` / `distributor_income_daily`，不进创作者/发行商收益余额，不触发结算补录，不产生未结清。响应新增 `deposit_rows` / `deposit_cents` 汇总，`row_reports` 每行新增 `category` 字段（收入/押金）。


        **增量 / 去重 / 查重规则**：

        - 同一 Excel 文件里重复出现的 `(短剧名称, 渠道, 日期)`：后续行标记为 `duplicate`，不入账。

        - 数据库已存在且金额相同：标记为 `unchanged`，不重复入账。

        - 数据库已存在但金额不同：标记为 `updated`，按差额调整收益。

        - 数据库不存在：标记为 `created`，新增并全额入账。

        - 短剧不存在 / 名称不唯一 / 未绑定创作者 / 格式错误：标记为 `failed`。


        返回 `row_reports` 是逐行上传报告，可直接给财务展示失败原因、重复行、增量变化。

        **2026-08-12 新增：结算单自动补录**。导入完成后，如果该周期已有 `unsettled` 状态的结算单，
        系统自动按最新 `creator_stats_daily` 重新汇总并更新结算单金额（`supplemented_settlements` 字段）。
        对于非 unsettled 状态（settled/void）的结算单，不更新，计入 `blocked_settlements`。

        '
      x-apifox-status: released
