                type: string
                description: 封面 URL
              episode_id:
                type: integer
                description: 最近观看的剧集 ID
              episode_no:
                type: integer
                description: 第几集
              progress_seconds:
                type: integer
                description: 本集观看进度（秒）
              updated_at:
                type: string
                description: 最近播放时间
          description: 当前页数据
        page:
          type: integer
          description: 当前页码，从 1 开始
        page_size:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总记录数
        has_more:
          type: boolean
          description: 是否还有下一页
    LikeResponse:
