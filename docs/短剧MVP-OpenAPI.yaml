    RechargeSyncRequest:
      type: object
      description: 充值单主动查单请求（无 body，recharge_no 在 path）
      properties: {}
    RechargeSyncResponse:
      type: object
      description: 充值单对账结果
      properties:
        recharge_no:
          type: string
          description: 充值单号
          example: RC20260725143012012345678
        status:
          type: string
          description: 充值单状态（对账后最新）
          enum:
          - pending
          - paid
          - closed
        amount_cents:
          type: integer
          format: int64
          description: 充值金额（分）
          example: 40000
        payment_method:
          type: string
          description: 支付渠道
          enum:
          - alipay
          - wechat
        platform_trade_no:
          type: string
          description: 渠道侧交易号
          nullable: true
        paid_at:
          type: string
          format: date-time
          description: 支付时间
          nullable: true
    RechargeSyncErrors:
      type: object
      description: 对账失败错误响应
      properties:
        code:
          type: integer
          description: HTTP 状态码
        message:
          type: string
          description: 错误描述
          enum:
          - 充值单不存在
          - 充值支付方式不支持查单
          - 支付渠道不可用,请检查密钥配置
          - 充值单已过期,不能标记已支付
          - 渠道侧金额与充值单金额不一致,请人工核对
          - 渠道侧渠道与充值单不一致,请人工核对
          - 查单失败:...
    AbandonStatus:
      type: string
      description: 放弃申请状态
      enum:
      - pending
      - approved
      - rejected
    AbandonRequest:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: 申请 ID
        abandon_no:
          type: string
          description: 申请单号（AB 前缀）
        distributor_id:
          type: integer
          format: uint64
          description: 发行商 ID
        drama_id:
          type: integer
          format: uint64
          description: 剧集 ID
        distributor_drama_id:
          type: integer
          format: uint64
          description: 关联 distributor_dramas.id
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/Platform'
          description: 放弃的平台列表
        original_platforms:
          type: array
          items:
            $ref: '#/components/schemas/Platform'
          description: 申请时的全部平台（快照）
        refund_amount_cents:
          type: integer
          format: int64
          description: 退还押金金额（分）
        original_deposit_cents:
          type: integer
          format: int64
          description: 原始押金总额（分，快照）
        reason:
          type: string
          description: 放弃原因
        reason_images:
          type: array
          items:
            type: string
            format: uri
          description: 放弃原因截图（URL 数组，最多 9 张）
        status:
          $ref: '#/components/schemas/AbandonStatus'
        reject_reason:
          type: string
          description: 驳回原因（驳回时填）
        reviewed_by:
          type: integer
          format: uint64
          nullable: true
          description: 审核人 ID
        reviewed_at:
          type: string
          format: date-time
          nullable: true
          description: 审核时间
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateAbandonRequest:
      type: object
      required:
      - platforms
      - reason
      properties:
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/Platform'
          description: 要放弃的平台列表，至少 1 个
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: 放弃原因
        reason_images:
          type: array
          items:
            type: string
            format: uri
          maxItems: 9
          description: 放弃原因截图（URL 数组，最多 9 张，通过 /v1/common/uploads/image-sign 上传后获取
            URL）
    RejectRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
          description: 驳回总体原因
        episode_reasons:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeReasonItem'
          description: 每集的具体原因（可选，新增）
    EpisodeReasonItem:
      type: object
      required:
      - episode_id
      - reason
      properties:
        episode_id:
          type: integer
          format: uint64
          description: 分集 ID
        reason:
          type: string
          description: 该集的打回/驳回原因
    SendbackRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 打回总体原因
        episode_reasons:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeReasonItem'
          description: 每集的具体原因（可选）
    Episode:
      type: object
      properties:
        id:
          type: integer
        drama_id:
          type: integer
        episode_no:
          type: integer
        title:
          type: string
        status:
          type: string
          enum:
          - uploading
          - ready
          - failed
        audit_reason:
          type: string
          description: 分集审核原因（打回/驳回时写入，重新提交时清除）
        duration_seconds:
          type: integer
        video_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
