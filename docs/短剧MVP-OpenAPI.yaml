              type: string
            nickname:
              type: string
            account_uid:
              type: string
            login_phone:
              type: string
        real_name_info:
          type: object
          description: 截图「实名信息」区域可直接使用的数据；与企业认证二选一。个人实名需要真实姓名、身份证号、银行卡号
          properties:
            real_name:
              type: string
            id_card_no_masked:
              type: string
            bank_name:
              type: string
            bank_card_no_masked:
              type: string
        identity_info:
          type: object
          description: 截图「创作者身份信息」区域可直接使用的数据
          properties:
            identity_mid:
              type: string
            identity_role:
              type: string
        enterprise_info:
