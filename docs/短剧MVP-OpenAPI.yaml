  /v1/publisher/dramas:
    get:
      tags:
      - Publisher-DramaMarket
      summary: 剧集广场列表
      description: '浏览所有可发行剧集，支持搜索和平台筛选。


        **筛选参数（2026-07-17 新增）**：

        - `claimable=true`：只返回剧本身可认领的条目（已上架 + 有可发行平台 + 开放发行）。

        - `can_claim=true`：只返回当前登录发行商当前可发起认领的条目（claimable + 已认证）。**推荐作为广场默认筛选**。

        - 两者可同时传，`can_claim` 优先级更高（已隐含 claimable）。

        - 不传时返回全部已上架剧集，兼容现有行为。

        - 筛选与 keyword、platform 可组合；分页 total / list 均按过滤后结果计算。


        **claimable 与 can_claim 语义差异**：

        - `claimable`：剧本身是否可认领（已上架 + 有可发行平台 + 允许发行），与发行商无关。

        - `can_claim`：当前发行商是否能认领（claimable + 发行商已认证），未认证的发行商会返回 false。


        每项返回 id/title/cover_url/episode_count/deposit_base_cents/deposit_all_cents/deposit_platform_rate/available_platforms/released_platforms/claimable/can_claim。

        '
      operationId: publisherListDramas
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          default: 20
      - name: keyword
        in: query
        schema:
          type: string
        description: 搜索剧名
      - name: platform
        in: query
        schema:
          type: string
        description: 按平台筛选
      - name: claimable
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: 传 "true" 时只返回剧本身可认领的条目（已上架 + 有可发行平台 + 开放发行）
      - name: can_claim
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: 传 "true" 时只返回当前发行商当前可发起认领的条目（claimable + 已认证）。推荐作为广场默认筛选
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
