            description: 业务数据；失败时为 null
    Product:
      type: object
      properties:
        id:
          type: integer
          description: 商品 ID
        name:
          type: string
          example: 单集解锁
          description: 商品名（如 "单集解锁"）
        type:
          type: string
          example: episode_unlock
          description: 商品类型；MVP 只有 episode_unlock
          enum:
          - episode_unlock
        price_cents:
          type: integer
          example: 600
          description: 占位价格（分）；实际解锁价格以 drama.price_cents 为准
    CreateOrderRequest:
      type: object
      required:
      - drama_id
      - episode_id
      - payment_method
      properties:
        drama_id:
          type: integer
          description: 短剧 ID
        episode_id:
          type: integer
          description: 要解锁的剧集 ID
        product_id:
          type: integer
          nullable: true
          description: 商品 ID；MVP 只有一种"单集解锁"商品，传任意 active 商品 id 即可
        payment_method:
          type: string
          enum:
          - wechat
          - alipay
          description: 支付渠道
        pay_scene:
          type: string
          enum:
          - app
          - wap
          description: '多端支付场景（app 默认 / wap=H5），微信和支付宝都按此选产品：

            - 支付宝 app → pay_params.order_string；wap → pay_params.pay_url

            - 微信 app → pay_params 含 appid/partnerid/prepayid/package/noncestr/timestamp/sign（客户端
            SDK 唤起）；wap(H5) → pay_params.h5_url

            '
    CreateOrderResponse:
      type: object
      properties:
        order_no:
          type: string
          description: 订单号；后续查询 / 解锁需要
        amount_cents:
          type: integer
          description: 订单金额（分）
        payment_method:
          type: string
          description: 本单实际走的支付渠道
        pay_params:
          type: object
          additionalProperties: true
          description: 支付渠道返回的拉起参数（微信 prepay_id / 支付宝 orderStr）；PAYMENT_DEV_MODE=true
            时为 mock 字段
    Order:
      type: object
      properties:
        order_no:
          type: string
          description: 订单号（业务键，全局唯一）
        amount_cents:
          type: integer
          description: 订单金额（分）；= 剧的 price_cents
        drama_id:
          type: integer
          description: 短剧 ID
        drama_title:
          type: string
          description: 短剧名（独立查询 dramas.title，剧被删时为 null）
        episode_id:
          type: integer
          description: 剧集 ID（解锁的目标集）
        episode_title:
          type: string
          description: 剧集名（独立查询 episodes.title，集被删时或 episode_id=0 时为 null）
        payment_method:
          type: string
          description: 支付渠道
          enum:
          - wechat
          - alipay
        platform_trade_no:
          type: string
          description: 支付渠道流水号；已支付才有
        status:
          type: string
          enum:
          - pending
          - paid
          - partial_refunded
          - refunded
          - failed
          - closed
          description: 订单状态（partial_refunded=部分退款）
        paid_at:
          type: string
          nullable: true
          description: 支付完成时间（ISO 8601）；未支付为 null
        refund_amount_cents:
          type: integer
          format: int64
          description: 累计已退金额（分）；部分退款时 < amount_cents，全退时 = amount_cents
        refunded_at:
          type: string
          format: date-time
          nullable: true
          description: 最近一次退款完成时间；未退款为 null
        refund_reason:
          type: string
          description: 退款原因
        refund_no:
          type: string
          description: 商户退款单号（幂等键）
        platform_refund_no:
          type: string
          description: 渠道侧退款流水号
    OrderPage:
      type: object
      properties:
        list:
          type: array
