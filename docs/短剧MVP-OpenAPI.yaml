        page_size:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总记录数
        has_more:
          type: boolean
          description: 是否还有下一页
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          description: 存活状态，固定 `ok`
          example: ok
        uptime_seconds:
          type: integer
          description: 进程已运行秒数
          example: 3600
    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          description: 就绪状态；成功为 `ready`，失败为 `not_ready`
          enum:
          - ready
          - not_ready
        database:
          type: string
          description: 数据库探活结果
          enum:
          - ok
          - error
        redis:
          type: string
          description: Redis 探活结果；未配置 Redis 时为 `skipped`
          enum:
          - ok
          - error
          - skipped
        uptime_seconds:
          type: integer
          description: 进程已运行秒数
    CreateEpisodeRequest:
      type: object
      required:
      - episode_no
      - vod_file_id
      properties:
        episode_no:
          type: integer
          description: 第几集（必填，同剧内唯一）
        title:
          type: string
          description: 本集标题
        vod_file_id:
          type: string
          description: VOD 文件 ID；前端走 vod-sign → vod-js-sdk 上传后得到
        video_url:
          type: string
          description: 视频播放地址（可不传，等 VOD 转码回调自动填）
        duration_seconds:
          type: integer
          description: 视频时长（秒）；不传走 VOD 回调写
    UpdateEpisodeRequest:
      type: object
      properties:
        title:
          type: string
          description: 本集标题
        vod_file_id:
          type: string
          description: VOD 文件 ID
        video_url:
          type: string
          description: 视频播放地址
        duration_seconds:
          type: integer
          description: 视频时长（秒）
        status:
          type: string
          description: 剧集状态
          enum:
          - uploading
          - ready
          - failed
    AdminEpisode:
      type: object
      properties:
        id:
          type: integer
          description: 剧集 ID
        episode_no:
          type: integer
          description: 第几集
        title:
          type: string
          description: 本集标题
        vod_file_id:
          type: string
          description: 腾讯云 VOD 文件 ID（前端用 vod-js-sdk-v6 上传完得到）
        duration_seconds:
          type: integer
          description: 视频时长（秒）；VOD 回调自动填入
        status:
          type: string
          description: 剧集状态。uploading=上传/转码中 / ready=可播 / failed=失败
          enum:
          - uploading
          - ready
          - failed
    BatchCreateEpisodesRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 100
          description: 批量项；单批最多 100 集，请求内 episode_no 不可重复
          items:
            type: object
            required:
            - episode_no
            properties:
              episode_no:
                type: integer
                minimum: 1
                description: 第几集（必填，同剧内唯一）
              title:
                type: string
                description: 本集标题
              vod_file_id:
                type: string
                description: 走 vod-sign + vod-js-sdk 上传后拿到的 FileId
              video_url:
                type: string
                description: 视频播放地址；给了就视为已就绪，入库后 status=ready
              duration_seconds:
                type: integer
                description: 视频时长（秒）；VOD 回调会覆盖
    ReorderEpisodesRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: 调整项列表；每项给出 episode_id 与目标 episode_no
          items:
            type: object
            required:
            - episode_id
            - episode_no
            properties:
              episode_id:
                type: integer
                description: 剧集 ID（必须属于路径上的 drama_id）
              episode_no:
                type: integer
                minimum: 1
                description: 目标 episode_no（请求内不可重复）
    UpsertCategoryRequest:
      type: object
      description: 创建 / 更新分类。POST 时 `name` 必填；PUT 时所有字段可选，传哪个改哪个。
      properties:
        type:
          type: string
          enum: *id001
          description: 维度。POST 不传默认 `theme`；PUT 可改维度。非法值返 40001。
        name:
          type: string
          description: 分类名（不同 type 下可重名）
        sort_order:
          type: integer
          description: 排序值；小的靠前
        status:
          type: string
          enum:
          - active
          - disabled
          description: 启用状态
    CreateCreatorRequest:
      type: object
      required:
      - phone
      properties:
        phone:
          type: string
          description: 创作者手机号；后续登录账号
        name:
          type: string
          description: 真实姓名（用于合同 / 提现）
    CreatorPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/Creator'
          description: 当前页数据
        page:
          type: integer
          description: 当前页码，从 1 开始
        page_size:
          type: integer
          description: 每页条数
        total:
          type: integer
          description: 总记录数
        has_more:
          type: boolean
          description: 是否还有下一页
    RejectWithdrawalRequest:
      type: object
      required:
      - remark
      properties:
        remark:
          type: string
          description: 拒绝原因；必填，会展示给创作者
    MarkWithdrawalPaidRequest:
      type: object
      required:
      - transaction_no
      properties:
        transaction_no:
          type: string
          description: 银行付款流水号
        remark:
          type: string
          description: 财务备注（可空）
    ReviewWithdrawalRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - approve
          - reject
          description: 决策（必填）—— 提现和发票联动
        withdrawal_action:
          type: string
          enum:
          - approve
          - reject
          description: 【已废弃，请用 action】提现决策（兼容老前端）
        transaction_no:
          type: string
          description: 银行付款流水号；带则同时把 withdrawal 设为 paid
        remark:
          type: string
          description: 审核意见；reject 时给创作者展示
    CreatorSettlementPreviewItem:
      type: object
      properties:
        drama_id:
          type: integer
        drama_title:
          type: string
        income_cents:
          type: integer
          description: period 内创作者实得（分）
        gross_cents:
          type: integer
          description: period 内该剧总流水（分）= income / creator_share_rate
        tax_cents:
          type: integer
          description: 税率（分）= gross - income
        withdrawable_cents:
          type: integer
          description: 可提现余额 = income - withdrawn
        withdrawn_cents:
          type: integer
          description: 已提现占用（pending+approved+paid）
        play_count:
          type: integer
          description: period 内播放量
    CreatorSettlementPreview:
      type: object
      properties:
        period:
          type: string
          description: YYYY-MM
        source:
          type: string
          description: preview=纯实时快照 / stored+preview=已落库且实时更新
        is_stored:
          type: boolean
          description: true 表示 cron 已落库（每月 1 号 02:00 自动跑 / 财务手动 generate）
        creator_id:
          type: integer
        creator_type:
          type: string
          enum:
          - personal
          - organization
        transfer_type:
          type: string
          enum:
          - private
          - public
        min_withdrawal_cents:
          type: integer
        summary:
          type: object
          properties:
            income_cents:
              type: integer
            withdrawable_cents:
              type: integer
            withdrawn_cents:
              type: integer
            creator_share_rate:
              type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreatorSettlementPreviewItem'
        note:
          type: string
          description: 本接口为实时快照（不入库），最终结算金额以系统每月 1 号 02:00 自动生成的结算单为准
    Contract:
      type: object
      properties:
        id:
          type: integer
          description: 合同 ID
        creator_id:
          type: integer
          description: 创作者 ID
        drama_id:
          type: integer
          description: 关联短剧 ID；可空（创作者通用合同）
        contract_no:
          type: string
          description: 合同编号（业务键）
        esign_flow_id:
          type: string
          description: 腾讯电子签流程 ID；P1 接入；线下扫描合同时为空
        file_url:
          type: string
          description: 可选的外部/手动合同文件链接（已停用系统自动生成 docx）。可下载的正式合同以上传的签署版 PDF 扫描件为准，见
            has_scan_file + GET .../contracts/{id}/scan
        has_scan_file:
          type: boolean
          description: 是否已上传签署后合同扫描件 PDF。为 true 时下载走 GET .../contracts/{id}/scan（私有
            presigned，不直接回 URL）
        status:
          type: string
          description: 合同状态
          enum:
          - pending
          - signing
          - signed
          - cancelled
    CreateContractRequest:
      type: object
      required:
      - creator_id
      - contract_no
      properties:
        creator_id:
          type: integer
          description: 创作者 ID（必填）
        drama_id:
          type: integer
          description: 关联短剧 ID（可选）
        contract_no:
          type: string
          description: 合同编号（业务键）
        file_url:
          type: string
          description: 合同 PDF 地址（线下扫描时直接填）
    VodSignRequest:
      type: object
      required:
      - filename
      properties:
        filename:
          type: string
          description: 原文件名（可选，仅作日志参考；签名内容不依赖文件名）
    VodSignResponse:
      type: object
      description: 腾讯云 VOD 客户端上传签名。前端把 signature 喂给 vod-js-sdk-v6 的 getSignature 回调即可直传
        VOD。
      properties:
        signature:
          type: string
          description: VOD 客户端上传签名（base64，含 20B HMAC-SHA1 + 原始 query）
        sub_app_id:
          type: integer
          description: VOD 子应用 ID，前端 SDK 需要此值定位上传目标
        region:
          type: string
          example: ap-chongqing
          description: VOD 地域
        procedure_name:
          type: string
          description: 任务流模板名；空 → 上传完直接 ready 不走转码
        expires_at:
          type: string
          format: date-time
          description: 签名过期时间，默认 1h
    Notification:
      type: object
      description: 创作者站内消息（纯文本 + 可选跳转链接）
      properties:
        id:
          type: integer
        title:
          type: string
          description: 消息标题
        content:
          type: string
          description: 消息正文（纯文本）
        link_url:
          type: string
          description: 可选跳转链接
        is_read:
          type: boolean
          description: 是否已读
        created_at:
          type: string
          format: date-time
    NotificationPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean
        unread_count:
          type: integer
          description: 当前创作者的未读消息总数
    PricingConfig:
      type: object
      description: 全局默认价格配置
      properties:
        free_episodes:
          type: integer
          description: 全局默认免费集数
        price_cents:
          type: integer
          description: 全局默认每集单价（分）
    CoverSpecsConfig:
      type: object
      description: 漫剧封面上传规格
      properties:
        max_count:
          type: integer
          description: 每部剧最多封面数
          example: 5
        max_size_mb:
          type: integer
          description: 单图最大体积（MB）
          example: 5
        specs:
          type: array
          description: 可选封面规格列表（前端按其中之一裁剪后上传）
          items:
            type: object
            properties:
              ratio:
                type: string
                description: 宽高比文案
                example: '7:10'
              ratio_w:
                type: integer
                description: 比例宽
              ratio_h:
                type: integer
                description: 比例高
              min_width:
                type: integer
                description: 最小宽（px）
              min_height:
                type: integer
                description: 最小高（px）
              max_size_mb:
                type: integer
                description: 该规格单图最大体积（MB）
              formats:
                type: array
                description: 允许的图片格式（后缀，小写）
                items:
                  type: string
                example:
                - jpg
                - jpeg
                - png
                - bmp
    UpdatePricingConfigRequest:
      type: object
      description: 更新全局价格配置；字段可选，传哪个改哪个
      properties:
        free_episodes:
          type: integer
          minimum: 0
        price_cents:
          type: integer
          minimum: 0
    DailyIncomeImportResult:
      type: object
      description: 财务 Excel 导入每日收入的结果；包含去重、增量和逐行失败报告
      properties:
        batch_no:
          type: string
          description: 本次导入批次号，用于日志和前端展示
        processed_rows:
          type: integer
          description: 本次解析并报告的总行数（含失败/重复）
        imported_rows:
          type: integer
          description: 实际新增或更新入账的行数（created + updated）
        created_rows:
          type: integer
          description: 新增入账行数
        updated_rows:
          type: integer
          description: 覆盖更新行数（按差额入账）
        unchanged_rows:
          type: integer
          description: 库内已存在且金额相同，未重复入账的行数
        duplicate_rows:
          type: integer
          description: 同一 Excel 文件内重复行数（已跳过）
        failed_rows:
          type: integer
          description: 格式错误 / 短剧不存在 / 名称不唯一等失败行数
