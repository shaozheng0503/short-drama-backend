  /v1/publisher/settlements/:id/remittance:
    post:
      tags:
      - Publisher - 发行商结算
      summary: 提交打款信息
      description: |
        发行商提交打款信息（银行流水号、打款凭证等）。

        **状态变更**：pending_payment → payment_submitted
        结算单从待打款变为已打款/待确认，等管理员确认到账后变为 settled。
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemittanceRequest'
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        $ref: '#/components/schemas/DistributorSettlementStatus'
                      status_label:
                        $ref: '#/components/schemas/DistributorSettlementStatusLabel'
        '409':
          description: 仅待打款状态可提交
